name: Restaurar sincronizacao imediata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-instant-sync.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar sincronizacao ao abrir e voltar ao painel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          marker = 'async function syncFromGitHub()'
          if marker not in text:
              needle = '        async function loadProjects({ migrateFavorites = false } = {}) {\n'
              sync = '''        let syncInFlight = false;\n\n        async function syncFromGitHub() {\n            if (syncInFlight) return;\n            syncInFlight = true;\n\n            try {\n                const { error } = await supabaseClient.functions.invoke("sync-repositorios-github", {\n                    body: { source: "dashboard" }\n                });\n\n                if (error) {\n                    console.error("Erro ao sincronizar com GitHub:", error);\n                    return;\n                }\n\n                await loadProjects({ migrateFavorites: false });\n            } catch (error) {\n                console.error("Erro ao sincronizar com GitHub:", error);\n            } finally {\n                syncInFlight = false;\n            }\n        }\n\n'''
              if needle not in text:
                  raise SystemExit('Ponto de insercao da sincronizacao nao encontrado')
              text = text.replace(needle, sync + needle, 1)

          old = '''        document.addEventListener("DOMContentLoaded", () => {\n            loadProjects({ migrateFavorites: true });\n        });\n'''
          new = '''        document.addEventListener("DOMContentLoaded", async () => {\n            await loadProjects({ migrateFavorites: true });\n            syncFromGitHub();\n        });\n\n        document.addEventListener("visibilitychange", () => {\n            if (document.visibilityState === "visible") {\n                syncFromGitHub();\n            }\n        });\n'''

          if old in text:
              text = text.replace(old, new, 1)
          elif 'document.addEventListener("visibilitychange"' not in text:
              raise SystemExit('Bloco DOMContentLoaded esperado nao encontrado')

          path.write_text(text)
          PY

      - name: Publicar ajuste
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteracao necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaurar sincronizacao imediata do painel"
          git push
