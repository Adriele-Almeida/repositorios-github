<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GitHub • Repositórios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                            950: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 border border-brand-500 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Link copiado com sucesso!</span>
    </div>

    <header class="border-b border-gray-800/80 bg-gray-950/70 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-[104px] py-5 flex items-center justify-between gap-5">
            <div class="min-w-0">
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">
                    Painel GitHub <span class="text-brand-400">• Repositórios</span>
                </h1>
                <p class="text-sm text-gray-400 mt-1">Adriele Almeida • Estrategista Digital</p>
            </div>

            <div class="flex items-stretch gap-2.5 shrink-0">
                <div class="min-w-[82px] px-3.5 py-2.5 rounded-xl border border-gray-800 bg-gray-900/65 flex flex-col items-center justify-center">
                    <span class="text-[28px] sm:text-3xl font-extrabold text-white block leading-none" id="stat-total-projects">0</span>
                    <span class="mt-1 text-[10px] font-semibold text-gray-500 uppercase tracking-[0.14em]">Projetos</span>
                </div>
                <a href="https://github.com/Adriele-Almeida" target="_blank" rel="noopener noreferrer" title="Acessar GitHub" aria-label="Acessar GitHub" class="w-12 sm:w-auto sm:px-4 inline-flex items-center justify-center gap-2 text-sm font-semibold text-gray-300 hover:text-white bg-gray-900/80 hover:bg-gray-800 border border-gray-800 rounded-xl transition duration-200">
                    <i class="fa-brands fa-github text-xl"></i>
                    <span class="hidden sm:inline">Acessar</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-gray-950/40 border border-gray-800/60 p-4 sm:p-5 rounded-2xl mb-6">
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 text-base"></i>
                </div>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Buscar por nome do projeto ou repositório..."
                    class="w-full h-[54px] pl-11 pr-11 bg-gray-900/80 border border-gray-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl text-sm sm:text-[15px] text-gray-200 placeholder-gray-500 outline-none transition duration-200"
                >
                <button id="clear-search" class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-gray-500 hover:text-gray-300 hidden" aria-label="Limpar busca">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <div class="mt-4 flex items-center justify-between gap-3">
                <div class="flex-1 inline-flex rounded-xl bg-gray-900 p-1 border border-gray-800/80 min-w-0">
                    <button id="filter-all" class="flex-1 h-11 px-4 rounded-lg text-sm font-semibold bg-brand-600 text-white transition duration-200">
                        Todos
                    </button>
                    <button id="filter-favorites" class="flex-1 h-11 px-4 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                        <span>Favoritos</span>
                    </button>
                </div>

                <button id="sort-toggle" class="shrink-0 h-[52px] w-[52px] rounded-xl bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-white hover:bg-gray-800 transition flex items-center justify-center" title="Ordenar alfabeticamente" aria-label="Alternar ordenação">
                    <span class="text-[13px] font-extrabold tracking-tight">A↑</span>
                </button>

                <div class="shrink-0 inline-flex rounded-xl bg-gray-900 p-1 border border-gray-800/80">
                    <button id="view-grid" class="h-11 w-11 rounded-lg bg-gray-800 text-brand-400 transition flex items-center justify-center" title="Visualização em Grade" aria-label="Visualização em Grade">
                        <i class="fa-solid fa-table-cells-large text-base"></i>
                    </button>
                    <button id="view-list" class="h-11 w-11 rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center" title="Visualização em Lista" aria-label="Visualização em Lista">
                        <i class="fa-solid fa-list text-base"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 transition-all duration-300"></div>

        <div id="no-results" class="hidden text-center py-20 bg-gray-950/20 rounded-2xl border border-dashed border-gray-800">
            <div class="h-16 w-16 bg-gray-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-800">
                <i class="fa-solid fa-magnifying-glass text-gray-600 text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-300">Nenhum projeto encontrado</h3>
            <p class="text-gray-500 mt-1 max-w-sm mx-auto text-sm">Verifique os termos digitados ou experimente limpar os filtros.</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://uptzkgvfdycxlqnsgokl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_9mJj4mF2-IJ5Y5WlSIkp7A_G9a9-f5e";
        const TABLE = "repositorios-github";
        const GITHUB_OWNER = "Adriele-Almeida";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let rawProjectsData = [];
        let state = {
            searchQuery: "",
            currentFilter: "all",
            viewMode: "grid",
            sortMode: "recent"
        };

        const projectsGrid = document.getElementById("projects-grid");
        const searchInput = document.getElementById("search-input");
        const clearSearchBtn = document.getElementById("clear-search");
        const viewGridBtn = document.getElementById("view-grid");
        const viewListBtn = document.getElementById("view-list");
        const filterAllBtn = document.getElementById("filter-all");
        const filterFavsBtn = document.getElementById("filter-favorites");
        const sortToggleBtn = document.getElementById("sort-toggle");
        const noResults = document.getElementById("no-results");
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toast-message");
        const totalProjects = document.getElementById("stat-total-projects");

        function projectLinks(repo) {
            const encodedRepo = encodeURIComponent(repo);
            return {
                github: `https://github.com/${GITHUB_OWNER}/${encodedRepo}`,
                descodificado: repo.toLowerCase() === "adriele-almeida.github.io"
                    ? "https://adriele-almeida.github.io/"
                    : `https://adriele-almeida.github.io/${encodedRepo}/`
            };
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");
            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
                toast.classList.remove("translate-y-0", "opacity-100");
            }, 2500);
        }

        function parseTimestamp(value) {
            if (!value) return null;
            const timestamp = Date.parse(value);
            return Number.isFinite(timestamp) ? timestamp : null;
        }

        function getActivityTimestamp(project) {
            const candidates = [
                parseTimestamp(project.added_at),
                parseTimestamp(project.github_updated_at)
            ].filter(Number.isFinite);

            if (candidates.length > 0) {
                return Math.max(...candidates);
            }

            return parseTimestamp(project.github_created_at);
        }

        function formatActivity(project) {
            const timestamp = getActivityTimestamp(project);
            if (!Number.isFinite(timestamp)) return "";

            return new Intl.DateTimeFormat("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
                timeZone: "America/Sao_Paulo"
            }).format(new Date(timestamp)).replace(",", " •");
        }

        function updateSortButton() {
            const alphabetical = state.sortMode === "alphabetical";

            sortToggleBtn.className = alphabetical
                ? "shrink-0 h-[52px] w-[52px] rounded-xl bg-brand-600 border border-brand-500 text-white transition flex items-center justify-center shadow-lg shadow-brand-500/10"
                : "shrink-0 h-[52px] w-[52px] rounded-xl bg-gray-900 border border-gray-800/80 text-gray-400 hover:text-white hover:bg-gray-800 transition flex items-center justify-center";

            sortToggleBtn.title = alphabetical
                ? "Ordem alfabética ativa. Clique para ordenar por atividade recente"
                : "Ordenar alfabeticamente";
        }

        async function migrateLegacyFavorites() {
            const migrationKey = "repositorios_github_favs_migrated_v1";
            if (localStorage.getItem(migrationKey) === "1") return false;

            let legacyFavorites = [];
            try {
                legacyFavorites = JSON.parse(localStorage.getItem("descodificado_favs") || "[]");
            } catch {
                legacyFavorites = [];
            }

            const ids = legacyFavorites
                .map(Number)
                .filter(Number.isFinite);

            if (ids.length > 0) {
                const { error } = await supabaseClient
                    .from(TABLE)
                    .update({ favorite: true })
                    .in("id", ids);

                if (error) {
                    console.error("Erro ao migrar favoritos antigos:", error);
                    return false;
                }
            }

            localStorage.setItem(migrationKey, "1");
            return ids.length > 0;
        }

        let syncInFlight = false;
        let lastSyncAt = 0;
        const SYNC_MIN_INTERVAL_MS = 60_000;

        async function syncFromGitHub({ force = false } = {}) {
            const now = Date.now();
            if (syncInFlight || (!force && now - lastSyncAt < SYNC_MIN_INTERVAL_MS)) return;
            syncInFlight = true;
            lastSyncAt = now;

            try {
                const { error } = await supabaseClient.functions.invoke("sync-repositorios-github", {
                    body: { source: "dashboard" }
                });

                if (error) {
                    console.error("Erro ao sincronizar com GitHub:", error);
                    return;
                }

                await loadProjects({ migrateFavorites: false });
            } catch (error) {
                console.error("Erro ao sincronizar com GitHub:", error);
            } finally {
                syncInFlight = false;
            }
        }

        async function loadProjects({ migrateFavorites = false } = {}) {
            const { data, error } = await supabaseClient
                .from(TABLE)
                .select("id,name,repo,favorite,added_at,github_created_at,github_updated_at");

            if (error) {
                console.error("Erro ao carregar projetos:", error);
                showToast("Erro ao carregar projetos.");
                return;
            }

            rawProjectsData = (data || []).map(project => ({
                ...project,
                ...projectLinks(project.repo)
            }));

            totalProjects.textContent = rawProjectsData.length;

            if (migrateFavorites) {
                const migrated = await migrateLegacyFavorites();
                if (migrated) {
                    await loadProjects({ migrateFavorites: false });
                    return;
                }
            }

            render();
        }

        async function toggleFavorite(id) {
            const project = rawProjectsData.find(item => item.id === id);
            if (!project) return;

            const previousValue = project.favorite;
            const newValue = !previousValue;
            project.favorite = newValue;
            render();

            const { error } = await supabaseClient
                .from(TABLE)
                .update({ favorite: newValue })
                .eq("id", id);

            if (error) {
                console.error("Erro ao atualizar favorito:", error);
                project.favorite = previousValue;
                render();
                showToast("Não foi possível atualizar o favorito.");
                return;
            }

            showToast(newValue ? "Adicionado aos favoritos!" : "Removido dos favoritos!");
        }

        async function copyUrl(url, type) {
            try {
                await navigator.clipboard.writeText(url);
            } catch {
                const tempInput = document.createElement("input");
                tempInput.value = url;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            }
            showToast(`Link do ${type} copiado!`);
        }

        function normalizeText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }

        function compareAlphabetical(a, b) {
            const aName = String(a.name || "").trim();
            const bName = String(b.name || "").trim();
            const aStartsNumber = /^\d/.test(aName);
            const bStartsNumber = /^\d/.test(bName);

            if (aStartsNumber !== bStartsNumber) {
                return aStartsNumber ? 1 : -1;
            }

            return normalizeText(aName).localeCompare(
                normalizeText(bName),
                "pt-BR",
                { numeric: true, sensitivity: "base" }
            );
        }

        function render() {
            updateSortButton();

            let filtered = rawProjectsData.filter(proj => {
                const query = normalizeText(state.searchQuery);
                const searchable = normalizeText([proj.name, proj.repo].join(" "));

                const matchesSearch = searchable.includes(query);
                if (state.currentFilter === "favorites") {
                    return matchesSearch && proj.favorite;
                }
                return matchesSearch;
            });

            if (state.sortMode === "alphabetical") {
                filtered.sort(compareAlphabetical);
            } else {
                filtered.sort((a, b) => {
                    const aActivity = getActivityTimestamp(a) ?? 0;
                    const bActivity = getActivityTimestamp(b) ?? 0;

                    if (aActivity !== bActivity) {
                        return bActivity - aActivity;
                    }

                    return compareAlphabetical(a, b);
                });
            }

            projectsGrid.innerHTML = "";
            if (filtered.length === 0) {
                projectsGrid.classList.add("hidden");
                noResults.classList.remove("hidden");
                return;
            }

            projectsGrid.classList.remove("hidden");
            noResults.classList.add("hidden");

            if (state.viewMode === "grid") {
                projectsGrid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 transition-all duration-300";

                filtered.forEach(proj => {
                    const activity = formatActivity(proj);
                    const card = document.createElement("div");
                    card.className = "bg-gray-900/60 border border-gray-800/80 rounded-2xl p-[18px] sm:p-5 hover:border-brand-500/50 hover:bg-gray-900 transition-all duration-300 hover:shadow-xl hover:shadow-brand-500/5 group relative flex flex-col justify-between min-h-[176px]";

                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-4 mb-5">
                            <div class="min-w-0 flex-1">
                                <h3 class="text-[17px] sm:text-lg font-bold text-gray-100 group-hover:text-brand-400 transition line-clamp-2 leading-snug pt-0.5">
                                    ${escapeHtml(proj.name)}
                                </h3>
                                ${activity ? `<p class="mt-1.5 text-[11px] leading-none font-medium text-gray-500">${escapeHtml(activity)}</p>` : ""}
                            </div>
                            <button onclick="toggleFavorite(${proj.id})" class="shrink-0 h-9 w-9 rounded-lg inline-flex items-center justify-center text-gray-500 hover:text-amber-400 hover:bg-gray-800/80 transition" title="Favoritar" aria-label="Favoritar">
                                <i class="${proj.favorite ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-base"></i>
                            </button>
                        </div>

                        <div class="space-y-2 mt-auto">
                            <div class="flex items-stretch gap-2">
                                <a href="${proj.descodificado}" target="_blank" rel="noopener noreferrer" class="h-11 flex-1 inline-flex items-center justify-center gap-2 px-3 bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold rounded-xl transition duration-200">
                                    <i class="fa-solid fa-square-arrow-up-right text-xs"></i>
                                    <span>Acessar Site</span>
                                </a>
                                <button onclick="copyUrl('${proj.descodificado}', 'Site')" class="h-11 w-11 shrink-0 bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white rounded-xl transition inline-flex items-center justify-center" title="Copiar Link do Site" aria-label="Copiar Link do Site">
                                    <i class="fa-solid fa-copy text-sm"></i>
                                </button>
                            </div>

                            <div class="flex items-stretch gap-2">
                                <a href="${proj.github}" target="_blank" rel="noopener noreferrer" class="h-11 flex-1 inline-flex items-center justify-center gap-2 px-3 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-semibold rounded-xl border border-gray-700/60 transition duration-200">
                                    <i class="fa-brands fa-github text-sm"></i>
                                    <span>Código GitHub</span>
                                </a>
                                <button onclick="copyUrl('${proj.github}', 'GitHub')" class="h-11 w-11 shrink-0 bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white rounded-xl transition inline-flex items-center justify-center" title="Copiar Link do GitHub" aria-label="Copiar Link do GitHub">
                                    <i class="fa-solid fa-copy text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    projectsGrid.appendChild(card);
                });
            } else {
                projectsGrid.className = "flex flex-col gap-3 transition-all duration-300";

                filtered.forEach(proj => {
                    const activity = formatActivity(proj);
                    const listRow = document.createElement("div");
                    listRow.className = "bg-gray-900/60 border border-gray-800/80 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:border-brand-500/40 hover:bg-gray-900 transition duration-200";

                    listRow.innerHTML = `
                        <div class="flex items-start justify-between gap-3 md:min-w-[280px]">
                            <div class="min-w-0">
                                <h3 class="text-[15px] font-bold text-gray-100">${escapeHtml(proj.name)}</h3>
                                ${activity ? `<p class="mt-1.5 text-[11px] leading-none font-medium text-gray-500">${escapeHtml(activity)}</p>` : ""}
                            </div>
                            <button onclick="toggleFavorite(${proj.id})" class="shrink-0 h-9 w-9 rounded-lg inline-flex items-center justify-center text-gray-500 hover:text-amber-400 hover:bg-gray-800/80 transition" title="Favoritar" aria-label="Favoritar">
                                <i class="${proj.favorite ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-base"></i>
                            </button>
                        </div>

                        <div class="flex flex-wrap items-center gap-3">
                            <div class="flex items-center bg-gray-950/80 rounded-xl border border-gray-800/60 p-1">
                                <a href="${proj.descodificado}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-brand-600/90 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg transition">
                                    <i class="fa-solid fa-square-arrow-up-right mr-1.5"></i>Site
                                </a>
                                <button onclick="copyUrl('${proj.descodificado}', 'Site')" class="p-1.5 text-gray-400 hover:text-white transition ml-1" title="Copiar Link do Site">
                                    <i class="fa-solid fa-copy text-xs"></i>
                                </button>
                            </div>

                            <div class="flex items-center bg-gray-950/80 rounded-xl border border-gray-800/60 p-1">
                                <a href="${proj.github}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-lg transition">
                                    <i class="fa-brands fa-github mr-1.5"></i>GitHub
                                </a>
                                <button onclick="copyUrl('${proj.github}', 'GitHub')" class="p-1.5 text-gray-400 hover:text-white transition ml-1" title="Copiar Link do GitHub">
                                    <i class="fa-solid fa-copy text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    projectsGrid.appendChild(listRow);
                });
            }
        }

        searchInput.addEventListener("input", (e) => {
            state.searchQuery = e.target.value;
            if (state.searchQuery.trim() !== "") {
                clearSearchBtn.classList.remove("hidden");
            } else {
                clearSearchBtn.classList.add("hidden");
            }
            render();
        });

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            state.searchQuery = "";
            clearSearchBtn.classList.add("hidden");
            render();
        });

        sortToggleBtn.addEventListener("click", () => {
            state.sortMode = state.sortMode === "recent" ? "alphabetical" : "recent";
            render();
        });

        viewGridBtn.addEventListener("click", () => {
            state.viewMode = "grid";
            viewGridBtn.className = "h-11 w-11 rounded-lg bg-gray-800 text-brand-400 transition flex items-center justify-center";
            viewListBtn.className = "h-11 w-11 rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center";
            render();
        });

        viewListBtn.addEventListener("click", () => {
            state.viewMode = "list";
            viewListBtn.className = "h-11 w-11 rounded-lg bg-gray-800 text-brand-400 transition flex items-center justify-center";
            viewGridBtn.className = "h-11 w-11 rounded-lg text-gray-400 hover:text-white transition flex items-center justify-center";
            render();
        });

        filterAllBtn.addEventListener("click", () => {
            state.currentFilter = "all";
            filterAllBtn.className = "flex-1 h-11 px-4 rounded-lg text-sm font-semibold bg-brand-600 text-white transition duration-200";
            filterFavsBtn.className = "flex-1 h-11 px-4 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition duration-200 flex items-center justify-center gap-2";
            render();
        });

        filterFavsBtn.addEventListener("click", () => {
            state.currentFilter = "favorites";
            filterFavsBtn.className = "flex-1 h-11 px-4 rounded-lg text-sm font-semibold bg-brand-600 text-white transition duration-200 flex items-center justify-center gap-2";
            filterAllBtn.className = "flex-1 h-11 px-4 rounded-lg text-sm font-semibold text-gray-400 hover:text-white transition duration-200";
            render();
        });

        supabaseClient
            .channel("repositorios-github-realtime")
            .on(
                "postgres_changes",
                { event: "*", schema: "public", table: TABLE },
                () => loadProjects({ migrateFavorites: false })
            )
            .subscribe((status) => {
                if (status === "CHANNEL_ERROR") {
                    console.error("Erro na conexão Realtime do Supabase.");
                }
            });

        document.addEventListener("DOMContentLoaded", async () => {
            await loadProjects({ migrateFavorites: true });
            syncFromGitHub({ force: true });
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                syncFromGitHub();
            }
        });
    </script>
</body>
</html>
